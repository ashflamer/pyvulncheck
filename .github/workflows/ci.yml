name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The curated dataset ages; a weekly run catches regressions early.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        # The suite is fully offline; fixtures are captured OSV responses.
        run: python -m pytest tests -q

      - name: Smoke-test the CLI
        run: |
          pyvulncheck --version
          pyvulncheck --help

  dataset:
    name: Validate curated advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every advisory file against the schema
        run: python scripts/validate_dataset.py

  self-scan:
    name: Scan this repo with itself
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: pyvulncheck
        run: pyvulncheck . --format sarif --output pyvulncheck.sarif || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pyvulncheck.sarif
        continue-on-error: true
