[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvulncheck"
version = "0.1.0"
description = "Reachability-based vulnerability triage for Python - does your code actually call the vulnerable function?"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ashflamer" }]
keywords = ["security", "vulnerability", "sca", "reachability", "call-graph", "osv", "cve"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# No runtime dependencies. A security tool should not widen your attack
# surface to run, and stdlib-only means it installs anywhere.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/ashflamer/pyvulncheck"
Issues = "https://github.com/ashflamer/pyvulncheck/issues"

[project.scripts]
pyvulncheck = "pyvulncheck.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyvulncheck = ["data/advisories/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/pyvulncheck"]
